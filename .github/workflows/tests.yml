name: Tests

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main



jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install
        run: |
          pip install -e .[dev]

      
      - name: Unit tests
        env:
          API_KEY: test_key
        run: |
          pytest tests/unit